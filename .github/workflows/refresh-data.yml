name: Refresh main-contract data

on:
  schedule:
    # 08:30 Asia/Shanghai on trading weekdays (00:30 UTC)
    - cron: "30 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-main-contracts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh main-contract reference prices
        run: node scripts/fetch-reference-prices.mjs

      - name: Refresh main-contract activity snapshot
        run: node scripts/fetch-activity.mjs

      - name: Run tests
        run: npm test

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- src/assets/reference-prices.js src/assets/activity.js; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/reference-prices.js src/assets/activity.js
          git commit -m "chore: refresh main-contract data"
          git pull --rebase origin main
          git push
